<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANFA ÖGG AKADEMİ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <div id="splash">
        <img src="anfa.gif" class="splash-gif">
    </div>

    <div class="water-bg"></div>

    <header id="main-header" style="display:none;">
        <div class="logo"><strong>ANFA</strong> <span>AKADEMİ</span></div>
        <button class="menu-btn" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
    </header>

    <div id="side-menu" class="side-menu">
        <div class="menu-header">AYARLAR</div>
        <button onclick="location.reload()"><i class="fas fa-sync"></i> Güncellemeleri Denetle</button>
        <button onclick="window.print()"><i class="fas fa-file-pdf"></i> Sonuçları Yazdır</button>
        <hr>
        <button onclick="toggleMenu()" class="close-btn">Kapat</button>
    </div>

    <div id="entry-screen" class="container" style="display:none;">
        <div class="glass-card fade-in">
            <h2>SINAV KATEGORİSİ</h2>
            <div class="selection-grid">
                <div id="opt-silahli" class="opt active" onclick="setTur('silahli')">SİLAHLI</div>
                <div id="opt-silahsiz" class="opt" onclick="setTur('silahsiz')">SİLAHSIZ</div>
            </div>
            <div class="selection-grid">
                <div id="opt-sureli" class="opt active" onclick="setMod('sureli')">SÜRELİ</div>
                <div id="opt-suresiz" class="opt" onclick="setMod('suresiz')">SÜRESİZ</div>
            </div>
            <button class="glow-btn" onclick="sinaviBaslat()">BAŞLAT</button>
        </div>
    </div>

    <div id="quiz-screen" class="container" style="display:none;">
        <div class="quiz-header">
            <span id="timer"><i class="fas fa-clock"></i> 165:00</span>
            <span id="q-counter">Soru: 1/120</span>
        </div>

        <div class="question-box glass-card">
            <p id="q-text">Soru yükleniyor...</p>
        </div>

        <div class="options-area" id="options-parent">
            <button id="btn-A" class="choice-btn" onclick="cevapla('A', this)">A) Şık Yükleniyor...</button>
            <button id="btn-B" class="choice-btn" onclick="cevapla('B', this)">B) Şık Yükleniyor...</button>
            <button id="btn-C" class="choice-btn" onclick="cevapla('C', this)">C) Şık Yükleniyor...</button>
            <button id="btn-D" class="choice-btn" onclick="cevapla('D', this)">D) Şık Yükleniyor...</button>
            <button id="btn-E" class="choice-btn" onclick="cevapla('E', this)">E) Şık Yükleniyor...</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
