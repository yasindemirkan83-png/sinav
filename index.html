<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANFA ÖGG AKADEMİ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <div class="water-bg"></div>

    <header id="main-header">
        <div class="logo-area">
            <strong>ANFA</strong> <span>AKADEMİ</span>
        </div>
        <button class="settings-btn" onclick="toggleMenu()"><i class="fas fa-cog"></i></button>
    </header>

    <div id="side-menu" class="side-menu">
        <div class="menu-content">
            <h3>AYARLAR</h3>
            <button onclick="adminGiris()"><i class="fas fa-lock"></i> Admin Paneli</button>
            <button onclick="indirSoruBankasi()"><i class="fas fa-file-pdf"></i> Soruları İndir</button>
            <hr>
            <button onclick="location.reload()"><i class="fas fa-redo"></i> Sistemi Sıfırla</button>
            <button onclick="toggleMenu()" class="close-btn">Kapat</button>
        </div>
    </div>

    <div id="entry-screen" class="entry-container">
        <div class="glass-card">
            <h2>Sınav Türü Seçimi</h2>
            <div class="selection-box">
                <div class="option active" id="opt-silahli" onclick="setTur('silahli')">
                    <i class="fas fa-crosshairs"></i><span>Silahlı</span>
                </div>
                <div class="option" id="opt-silahsiz" onclick="setTur('silahsiz')">
                    <i class="fas fa-user-shield"></i><span>Silahsız</span>
                </div>
            </div>
        </div>

        <div class="glass-card">
            <h2>Zamanlama Modu</h2>
            <div class="selection-box">
                <div class="option active" id="opt-sureli" onclick="setMod('sureli')">
                    <i class="fas fa-stopwatch"></i><span>Süreli</span>
                </div>
                <div class="option" id="opt-suresiz" onclick="setMod('suresiz')">
                    <i class="fas fa-infinity"></i><span>Süresiz</span>
                </div>
            </div>
        </div>

        <div class="start-zone">
            <button class="glow-button" onclick="sinaviBaslat()">SINAVI BAŞLAT</button>
        </div>
    </div>

    <div id="quiz-screen" class="quiz-container" style="display:none;">
        <div class="top-info">
            <span id="timer"><i class="fas fa-clock"></i> 165:00</span>
            <span id="q-counter">Soru: 1</span>
        </div>
        
        <div class="pdf-box">
            <iframe id="pdf-frame" src="sinav.pdf" width="100%" height="100%"></iframe>
        </div>

        <div class="answer-box">
            <div class="options-grid">
                <button onclick="cevapla('A')">A</button>
                <button onclick="cevapla('B')">B</button>
                <button onclick="cevapla('C')">C</button>
                <button onclick="cevapla('D')">D</button>
                <button onclick="cevapla('E')">E</button>
            </div>
            <button class="skip-btn" onclick="atla()">Soruyu Atla</button>
        </div>
    </div>

    <div id="admin-modal" class="modal" style="display:none;">
        <div class="modal-content glass-card">
            <h3>Admin Girişi</h3>
            <textarea id="cevap-input" rows="5" placeholder="Cevapları bitişik yazın..."></textarea>
            <button class="glow-button" onclick="kaydetAdmin()">KAYDET</button>
            <button class="skip-btn" onclick="closeAdmin()">İPTAL</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
