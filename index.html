<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANFA ÖGG AKADEMİ</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00d2ff">
    <link rel="apple-touch-icon" href="anfa.gif">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="splash"><img src="anfa.gif" class="splash-gif"></div>

    <div id="install-banner" style="display:none;">
        <span><i class="fas fa-download"></i> ANFA Akademi'yi Telefona Kur</span>
        <button onclick="installApp()">YÜKLE</button>
    </div>

    <header id="main-header" style="display:none;">
        <div class="logo"><strong>ANFA</strong> <span>AKADEMİ</span></div>
        <button class="menu-btn" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
    </header>

    <div id="side-menu" class="side-menu">
        <div class="menu-header">AYARLAR</div>
        <button onclick="adminPanelAc()"><i class="fas fa-upload"></i> Soru Yükle (Admin)</button>
        <button onclick="kullaniciCevaplariPdfIndir()"><i class="fas fa-user-check"></i> Kullanıcı Cevaplarını İndir</button>
        <button onclick="tumSorulariPdfIndir()"><i class="fas fa-book"></i> Eğitim Sorularını İndir</button>
        <button onclick="istatistikSifirla()"><i class="fas fa-sync"></i> Sistemi Sıfırla</button>
        <hr>
        <button onclick="toggleMenu()" class="close-btn">Kapat</button>
    </div>

    <div id="admin-modal" class="modal" style="display:none;">
        <div class="glass-card">
            <h3>SORU YÜKLE (JSON)</h3>
            <p>Hazırladığın sorular.json dosyasını seç ve sisteme kaydet.</p>
            <input type="file" id="json-upload" accept=".json" onchange="jsonCihazaKaydet(event)" style="margin-bottom: 15px; color: white;">
            <button class="glow-btn" onclick="adminPanelKapat()" style="background: #e74c3c;">Kapat</button>
        </div>
    </div>

    <div id="entry-screen" class="container" style="display:none;">
        <div class="glass-card">
            <h2>SINAV KATEGORİSİ</h2>
            <div class="selection-grid">
                <div id="opt-silahli" class="opt active" onclick="setTur('silahli')">SİLAHLI</div>
                <div id="opt-silahsiz" class="opt" onclick="setTur('silahsiz')">SİLAHSIZ</div>
            </div>
            <div class="selection-grid">
                <div id="opt-sureli" class="opt active" onclick="setMod('sureli')">SÜRELİ</div>
                <div id="opt-suresiz" class="opt" onclick="setMod('suresiz')">SÜRESİZ</div>
            </div>
            <button class="glow-btn" onclick="sinaviBaslat()">SINAVI BAŞLAT</button>
        </div>
    </div>

    <div id="quiz-screen" class="container" style="display:none;">
        <div class="quiz-header">
            <span id="timer"><i class="fas fa-clock"></i> 165:00</span>
            <span id="q-counter">Soru: 1</span>
        </div>
        <div class="question-box glass-card">
            <p id="q-text">Soru yükleniyor...</p>
        </div>
        <div class="options-area" id="options-parent">
            <button id="btn-A" class="choice-btn" onclick="cevapla('A', this)"></button>
            <button id="btn-B" class="choice-btn" onclick="cevapla('B', this)"></button>
            <button id="btn-C" class="choice-btn" onclick="cevapla('C', this)"></button>
            <button id="btn-D" class="choice-btn" onclick="cevapla('D', this)"></button>
            <button id="btn-E" class="choice-btn" onclick="cevapla('E', this)"></button>
        </div>
    </div>

    <div id="result-screen" class="container" style="display:none;">
        <div class="glass-card">
            <h2>SINAV SONUCU</h2>
            <p id="result-text" style="font-size: 1.2rem; line-height: 2;"></p>
            <button class="glow-btn" onclick="sonucPdfIndir()" style="background: #27ae60; margin-bottom: 15px;"><i class="fas fa-file-pdf"></i> SONUCU İNDİR</button>
            <button class="glow-btn" onclick="location.reload()"><i class="fas fa-home"></i> ANA SAYFA</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(() => console.log("PWA Aktif"));
        }
    </script>
</body>
</html>
