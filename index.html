<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANFA ÖGG AKADEMİ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <div class="water-bg"></div>

    <div id="splash">
        <img src="anfa.gif" alt="Yükleniyor..." class="splash-gif">
    </div>

    <header id="main-header" style="display:none;">
        <div class="logo-area"><strong>ANFA</strong> <span>AKADEMİ</span></div>
        <button class="menu-trigger" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
    </header>

    <div id="side-menu" class="side-menu">
        <div class="menu-content">
            <h3>AYARLAR</h3>
            <button onclick="adminGiris()"><i class="fas fa-lock"></i> Admin Paneli</button>
            <button onclick="pencereAc()"><i class="fas fa-file-pdf"></i> Soruları İndir</button>
            <hr>
            <button onclick="location.reload()"><i class="fas fa-sync"></i> Sistemi Güncelle</button>
            <button onclick="toggleMenu()" class="close-btn">Kapat</button>
        </div>
    </div>

    <div id="entry-screen" class="container" style="display:none;">
        <div class="glass-card">
            <h2>SINAV TÜRÜ</h2>
            <div class="selection-box">
                <div class="option active" id="opt-silahli" onclick="setTur('silahli')"><i class="fas fa-crosshairs"></i><br>Silahlı</div>
                <div class="option" id="opt-silahsiz" onclick="setTur('silahsiz')"><i class="fas fa-user-shield"></i><br>Silahsız</div>
            </div>
        </div>

        <div class="glass-card">
            <h2>MOD</h2>
            <div class="selection-box">
                <div class="option active" id="opt-sureli" onclick="setMod('sureli')"><i class="fas fa-stopwatch"></i><br>Süreli</div>
                <div class="option" id="opt-suresiz" onclick="setMod('suresiz')"><i class="fas fa-infinity"></i><br>Süresiz</div>
            </div>
        </div>

        <div class="start-zone">
            <button class="glow-button" onclick="sinaviBaslat()">SINAVI BAŞLAT</button>
        </div>
    </div>

    <div id="quiz-screen" class="container" style="display:none;">
        <div class="top-info">
            <span id="timer"><i class="fas fa-clock"></i> 165:00</span>
            <span id="q-counter">Soru: 1</span>
        </div>
        
        <div class="pdf-card glass-card">
            <button class="pdf-btn" onclick="pencereAc()">KİTAPÇIĞI AÇ (sorular.pdf)</button>
        </div>

        <div class="answer-section">
            <div class="options-grid" id="options-container">
                <button class="opt-btn" onclick="cevapla('A', this)">A</button>
                <button class="opt-btn" onclick="cevapla('B', this)">B</button>
                <button class="opt-btn" onclick="cevapla('C', this)">C</button>
                <button class="opt-btn" onclick="cevapla('D', this)">D</button>
                <button class="opt-btn" onclick="cevapla('E', this)">E</button>
            </div>
        </div>
    </div>

    <div id="admin-modal" class="modal" style="display:none;">
        <div class="modal-content glass-card">
            <h3>Cevap Anahtarı</h3>
            <textarea id="cevap-input" rows="6" placeholder="Bitişik yazın..."></textarea>
            <button class="glow-button" onclick="kaydetAdmin()">KAYDET</button>
            <button onclick="closeAdmin()" class="skip-btn">Vazgeç</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
