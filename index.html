<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANFA AKADEMİ</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00d2ff">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="splash"><img src="anfa.gif" class="splash-gif"></div>

    <div id="pwa-install-banner" class="pwa-banner" style="display:none;">
        <div class="pwa-content">
            <i class="fas fa-cloud-download-alt"></i>
            <span>Uygulamayı telefonunuza yükleyin</span>
        </div>
        <button onclick="installApp()" class="pwa-install-btn">YÜKLE</button>
    </div>

    <header id="main-header" style="display:none;">
        <div class="logo"><strong>ANFA</strong> <span>AKADEMİ</span></div>
        <button class="menu-btn" onclick="toggleMenu()"><i class="fas fa-bars"></i></button>
    </header>

    <div id="side-menu" class="side-menu">
        <div class="menu-header">MENÜ</div>
        <button onclick="kullaniciCevaplariPdfIndir()"><i class="fas fa-history"></i> Son Sonuçlarımı İndir</button>
        <button onclick="tumSorulariPdfIndir()"><i class="fas fa-book"></i> Eğitim Kitapçığı (PDF)</button>
        <button onclick="istatistikSifirla()" style="color:#ff4d4d;"><i class="fas fa-trash"></i> Verileri Sıfırla</button>
        <button onclick="toggleMenu()" class="close-menu-btn">Kapat</button>
    </div>

    <div id="entry-screen" class="container" style="display:none;">
        <div class="hero-card">
            <h1>Sınav Seçimi</h1>
            
            <p class="label">Eğitim Türü</p>
            <div class="selection-group">
                <div id="opt-silahli" class="opt active" onclick="setTur('silahli')">SİLAHLI</div>
                <div id="opt-silahsiz" class="opt" onclick="setTur('silahsiz')">SİLAHSIZ</div>
            </div>

            <p class="label">Soru Sıralaması</p>
            <div class="selection-group">
                <div id="opt-karisik" class="opt active" onclick="setSira('karisik')">KARIŞIK</div>
                <div id="opt-sirali" class="opt" onclick="setSira('sirali')">SIRALI</div>
            </div>

            <p class="label">Zamanlama</p>
            <div class="selection-group">
                <div id="opt-sureli" class="opt active" onclick="setMod('sureli')">SÜRELİ</div>
                <div id="opt-suresiz" class="opt" onclick="setMod('suresiz')">SÜRESİZ</div>
            </div>

            <button class="main-btn" onclick="sinaviBaslat()">BAŞLAT</button>
        </div>
    </div>

    <div id="quiz-screen" class="container" style="display:none;">
        <div class="stats-bar">
            <span id="timer"><i class="fas fa-clock"></i> 165:00</span>
            <span id="q-counter">1 / 120</span>
        </div>
        <div class="question-container glass-card" id="q-area"></div>
        <div class="options-grid" id="options-parent">
            <button id="btn-A" class="choice-btn" onclick="cevapla('A', this)"></button>
            <button id="btn-B" class="choice-btn" onclick="cevapla('B', this)"></button>
            <button id="btn-C" class="choice-btn" onclick="cevapla('C', this)"></button>
            <button id="btn-D" class="choice-btn" onclick="cevapla('D', this)"></button>
            <button id="btn-E" class="choice-btn" onclick="cevapla('E', this)"></button>
        </div>
    </div>

    <div id="result-screen" class="container" style="display:none;">
        <div class="glass-card result-box">
            <h2>Sınav Bitti</h2>
            <div id="result-text"></div>
            <button class="main-btn success" onclick="sonucPdfIndir()">PDF SONUÇ AL</button>
            <button class="main-btn" onclick="location.reload()">TEKRAR DENE</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
