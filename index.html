<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ANFA ÖGG AKADEMİ</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00d2ff">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div id="splash"><img src="anfa.gif" class="splash-gif"></div>

    <header id="main-header" style="display:none;">
        <div class="logo"><strong>ANFA</strong> <span>AKADEMİ</span></div>
    </header>

    <div id="entry-screen" class="container" style="display:none;">
        <div class="glass-card">
            <h2>SINAV KATEGORİSİ</h2>
            <div class="selection-grid">
                <div id="opt-silahli" class="opt active" onclick="setTur('silahli')">SİLAHLI</div>
                <div id="opt-silahsiz" class="opt" onclick="setTur('silahsiz')">SİLAHSIZ</div>
            </div>
            <div class="selection-grid">
                <div id="opt-sureli" class="opt active" onclick="setMod('sureli')">SÜRELİ</div>
                <div id="opt-suresiz" class="opt" onclick="setMod('suresiz')">SÜRESİZ</div>
            </div>
            <button class="glow-btn" onclick="sinaviBaslat()">SINAVI BAŞLAT</button>
        </div>
    </div>

    <div id="quiz-screen" class="container" style="display:none;">
        <div class="quiz-header">
            <span id="timer"><i class="fas fa-clock"></i> 165:00</span>
            <span id="q-counter">Soru: 1</span>
        </div>
        <div class="question-box glass-card">
            <p id="q-text">Yükleniyor...</p>
        </div>
        <div class="options-area" id="options-parent">
            <button id="btn-A" class="choice-btn" onclick="cevapla('A', this)"></button>
            <button id="btn-B" class="choice-btn" onclick="cevapla('B', this)"></button>
            <button id="btn-C" class="choice-btn" onclick="cevapla('C', this)"></button>
            <button id="btn-D" class="choice-btn" onclick="cevapla('D', this)"></button>
            <button id="btn-E" class="choice-btn" onclick="cevapla('E', this)"></button>
        </div>
    </div>

    <div id="result-screen" class="container" style="display:none;">
        <div class="glass-card">
            <h2>SINAV SONUCU</h2>
            <p id="result-text"></p>
            <button class="glow-btn" onclick="pdfIndir()" style="background: #27ae60; margin-bottom: 10px;">SONUÇLARI PDF İNDİR</button>
            <button class="glow-btn" onclick="location.reload()">YENİ SINAV</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => console.log("PWA Aktif"));
        }
    </script>
</body>
</html>
